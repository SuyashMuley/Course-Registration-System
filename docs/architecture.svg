<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 890" width="1300" height="890" font-family="Helvetica, Arial, sans-serif">
  <title>Course Registration System Architecture</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .region { fill: #f7f8fa; stroke: #8a94a6; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .obs { fill: #f4f1fa; stroke: #8a7ab5; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .box { fill: #ffffff; stroke: #4a5568; stroke-width: 1.5; }
      .cp { fill: #e3eefc; stroke: #2b6cb0; stroke-width: 2; }
      .ap { fill: #e4f5e9; stroke: #2f855a; stroke-width: 2; }
      .stretch { fill: #fafafa; stroke: #718096; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .alertbox { fill: #fdecec; stroke: #c53030; stroke-width: 1.5; }
      .t { font-size: 13px; fill: #1a202c; text-anchor: middle; }
      .tb { font-size: 13px; fill: #1a202c; text-anchor: middle; font-weight: bold; }
      .ts { font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .tl { font-size: 15px; fill: #1a202c; font-weight: bold; }
      .tn { font-size: 12px; fill: #2d3748; }
      .line { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .lineblue { stroke: #2b6cb0; stroke-width: 2.2; fill: none; marker-end: url(#arrb); }
      .linegreen { stroke: #2f855a; stroke-width: 2.2; fill: none; marker-end: url(#arrg); }
      .linedash { stroke: #718096; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arr); }
      .linefwd { stroke: #c05621; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arro); }
      .linerepl { stroke: #6b46c1; stroke-width: 2.2; fill: none; marker-end: url(#arrp); }
      .linered { stroke: #c53030; stroke-width: 1.8; fill: none; marker-end: url(#arrr); }
      .noarrow { stroke: #4a5568; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c53030"/></marker>
  </defs>

  <rect class="bg" width="1300" height="890"/>
  <text x="20" y="32" class="tl" font-size="18">Course Registration System: Architecture (Go, PostgreSQL, Redis on AWS)</text>

  <!-- ============ PRIMARY REGION ============ -->
  <rect class="region" x="20" y="50" width="800" height="650" rx="10"/>
  <text x="36" y="76" class="tl">Primary region (e.g., us-east-1)</text>

  <rect class="box" x="250" y="90" width="300" height="50" rx="6"/>
  <text x="400" y="112" class="tb">Load generator (k6 on EC2)</text>
  <text x="400" y="129" class="ts">1,000s of concurrent students</text>

  <rect class="box" x="250" y="170" width="300" height="50" rx="6"/>
  <text x="400" y="192" class="tb">AWS Application Load Balancer</text>
  <text x="400" y="209" class="ts">spreads requests across N instances</text>

  <rect class="box" x="150" y="260" width="150" height="60" rx="6"/>
  <text x="225" y="283" class="tb">Go app #1</text>
  <text x="225" y="301" class="ts">EC2, stateless, /metrics</text>
  <rect class="box" x="320" y="260" width="150" height="60" rx="6"/>
  <text x="395" y="283" class="tb">Go app #2</text>
  <text x="395" y="301" class="ts">EC2, stateless, /metrics</text>
  <rect class="box" x="490" y="260" width="150" height="60" rx="6"/>
  <text x="565" y="283" class="tb">Go app #N</text>
  <text x="565" y="301" class="ts">scaled 1, 2, 4, 8 (E2)</text>

  <rect class="stretch" x="660" y="260" width="140" height="60" rx="6"/>
  <text x="730" y="283" class="tb">SQS queue + workers</text>
  <text x="730" y="301" class="ts">stretch variant for E4</text>

  <!-- data layer -->
  <rect class="ap" x="60" y="400" width="200" height="70" rx="6"/>
  <text x="160" y="425" class="tb">ElastiCache Redis</text>
  <text x="160" y="443" class="ts">admission filter + read cache</text>
  <text x="160" y="458" class="ts">AP-leaning, never the source of truth</text>

  <rect class="cp" x="300" y="400" width="220" height="70" rx="6"/>
  <text x="410" y="425" class="tb">RDS Postgres Multi-AZ standby</text>
  <text x="410" y="443" class="ts">second availability zone</text>
  <text x="410" y="458" class="ts">synchronous, no lost commits</text>

  <rect class="cp" x="560" y="400" width="220" height="70" rx="6"/>
  <text x="670" y="425" class="tb">RDS Postgres PRIMARY</text>
  <text x="670" y="443" class="ts">single writer: seat counts</text>
  <text x="670" y="458" class="ts">CP: zero over-enrollment</text>

  <!-- arrows: LB path -->
  <path class="line" d="M400,140 L400,170"/>
  <path class="noarrow" d="M400,220 L400,240 M225,240 L565,240"/>
  <path class="line" d="M225,240 L225,260"/>
  <path class="line" d="M395,240 L395,260"/>
  <path class="line" d="M565,240 L565,260"/>
  <!-- bus below apps -->
  <path class="noarrow" d="M225,320 L225,360 M395,320 L395,360 M565,320 L565,360 M225,360 L620,360"/>
  <path class="linegreen" d="M225,360 L160,360 L160,400"/>
  <path class="lineblue" d="M620,360 L620,400"/>
  <text x="168" y="388" class="tn" fill="#2f855a">admission + cached reads</text>
  <text x="628" y="388" class="tn" fill="#2b6cb0">seat writes</text>
  <!-- SQS -->
  <path class="linedash" d="M640,290 L660,290"/>
  <path class="linedash" d="M730,320 L730,400"/>
  <!-- sync replication -->
  <path class="lineblue" d="M560,435 L520,435"/>
  <text x="540" y="422" class="ts">sync</text>


  <!-- notes in primary region -->
  <text x="36" y="575" class="tl" font-size="14">Design principle</text>
  <rect x="36" y="588" width="14" height="14" class="cp"/>
  <text x="58" y="600" class="tn">CP: seat register/drop goes through one consistent writer. During a partition it rejects writes.</text>
  <rect x="36" y="610" width="14" height="14" class="ap"/>
  <text x="58" y="622" class="tn">AP-leaning: course search and seat-count reads come from Redis or replicas. Brief staleness is OK.</text>
  <rect x="36" y="632" width="14" height="14" class="stretch"/>
  <text x="58" y="644" class="tn">Dashed gray: optional stretch (SQS queue). Redis is never trusted for the final seat decision.</text>
  <text x="36" y="672" class="tn">Experiments E1 to E6 run in this single region so cross-region latency does not distort them.</text>

  <!-- ============ SECOND REGION ============ -->
  <rect class="region" x="860" y="50" width="420" height="650" rx="10"/>
  <text x="876" y="76" class="tl">Second region (e.g., ap-south-1), E7 only</text>

  <rect class="box" x="900" y="90" width="340" height="50" rx="6"/>
  <text x="1070" y="112" class="tb">Remote load generator (EC2)</text>
  <text x="1070" y="129" class="ts">students at another campus / time zone</text>

  <rect class="box" x="900" y="170" width="340" height="50" rx="6"/>
  <text x="1070" y="192" class="tb">AWS Application Load Balancer</text>
  <text x="1070" y="209" class="ts">regional entry point</text>

  <rect class="box" x="900" y="260" width="160" height="60" rx="6"/>
  <text x="980" y="283" class="tb">Go app #1</text>
  <text x="980" y="301" class="ts">EC2, stateless</text>
  <rect class="box" x="1080" y="260" width="160" height="60" rx="6"/>
  <text x="1160" y="283" class="tb">Go app #2</text>
  <text x="1160" y="301" class="ts">EC2, stateless</text>

  <rect class="ap" x="880" y="400" width="190" height="70" rx="6"/>
  <text x="975" y="425" class="tb">RDS read replica</text>
  <text x="975" y="443" class="ts">local reads, may be stale</text>
  <text x="975" y="458" class="ts">AP-leaning</text>

  <rect class="ap" x="1090" y="400" width="170" height="70" rx="6"/>
  <text x="1175" y="425" class="tb">ElastiCache Redis</text>
  <text x="1175" y="443" class="ts">regional read cache</text>

  <path class="line" d="M1070,140 L1070,170"/>
  <path class="noarrow" d="M1070,220 L1070,240 M980,240 L1160,240"/>
  <path class="line" d="M980,240 L980,260"/>
  <path class="line" d="M1160,240 L1160,260"/>
  <path class="noarrow" d="M980,320 L980,360 M1160,320 L1160,360 M980,360 L1160,360"/>
  <path class="linegreen" d="M980,360 L975,360 L975,400"/>
  <path class="linegreen" d="M1160,360 L1175,360 L1175,400"/>
  <!-- forwarded writes -->
  <path class="linefwd" d="M900,300 L840,300 L840,440 L780,440"/>
  <text transform="rotate(-90 852 370)" x="852" y="370" class="tn" fill="#c05621" text-anchor="middle">forwarded writes</text>

  <text x="876" y="575" class="tn">Reads are served locally. Writes cross the region to the primary.</text>
  <text x="876" y="595" class="tn">E7 measures remote-client latency, replica lag, stale reads,</text>
  <text x="876" y="615" class="tn">and failover when the primary region is lost.</text>
  <text x="876" y="645" class="tn">Active-active writes are future work.</text>

  <!-- ============ OBSERVABILITY ============ -->
  <rect class="obs" x="20" y="722" width="1260" height="150" rx="10"/>
  <text x="36" y="864" class="tl">Observability and alerting (both regions)</text>

  <rect class="box" x="40" y="758" width="230" height="52" rx="6"/>
  <text x="155" y="779" class="tb">Prometheus + Grafana</text>
  <text x="155" y="796" class="ts">app metrics, dashboards per experiment</text>

  <rect class="box" x="290" y="758" width="210" height="52" rx="6"/>
  <text x="395" y="779" class="tb">CloudWatch Alarms</text>
  <text x="395" y="796" class="ts">RDS, ALB, EC2, ElastiCache</text>

  <rect class="box" x="520" y="758" width="230" height="52" rx="6"/>
  <text x="635" y="779" class="tb">Invariant checker</text>
  <text x="635" y="796" class="ts">alerts if enrolled &gt; capacity</text>

  <rect class="box" x="770" y="758" width="170" height="52" rx="6"/>
  <text x="855" y="779" class="tb">AWS Budgets</text>
  <text x="855" y="796" class="ts">cost thresholds</text>

  <rect class="alertbox" x="970" y="758" width="130" height="52" rx="6"/>
  <text x="1035" y="779" class="tb">SNS topic</text>
  <text x="1035" y="796" class="ts">alert delivery</text>

  <rect class="box" x="1130" y="758" width="130" height="52" rx="6"/>
  <text x="1195" y="779" class="tb">Email / chat</text>
  <text x="1195" y="796" class="ts">the team</text>

  <path class="noarrow" d="M155,810 L155,838 M395,810 L395,838 M635,810 L635,838 M855,810 L855,838 M155,838 L1035,838"/>
  <path class="linered" d="M1035,838 L1035,810"/>
  <text x="600" y="858" class="tn" text-anchor="middle" fill="#c53030">alerts</text>
  <path class="linered" d="M1100,784 L1130,784"/>

  <!-- metrics scrape lines up to regions -->
  <path class="linedash" d="M155,758 L155,735 L100,735 L100,703" />
  <path class="linedash" d="M395,758 L395,735 L1070,735 L1070,703" />
  <text x="260" y="716" class="ts">app metrics + CloudWatch metrics from both regions</text>

  <!-- async replication to region 2 (drawn last so it sits on top of region boxes) -->
  <path class="linerepl" d="M670,470 L670,525 L975,525 L975,472"/>
  <text x="822" y="517" class="ts" fill="#6b46c1">async cross-region replication (lag measured in E7)</text>
</svg>
